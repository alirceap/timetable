<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مولد الجداول الدراسية - فردي / زوجي</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<h1>📘 مولد الجداول الدراسية - نسخة ذكية</h1>

<section>
  <h2>بيانات الكلية</h2>
  <input type="text" id="daysInput" placeholder="أيام العمل (مثال: السبت,الأحد,...)">
  <input type="number" id="startHour" placeholder="ساعة البداية (مثال: 9)">
  <input type="number" id="endHour" placeholder="ساعة النهاية (مثال: 15)">
</section>

<section>
  <h2>القاعات المتاحة</h2>
  <input type="text" id="roomInput" placeholder="اسم القاعة">
  <button onclick="addRoom()">➕ إضافة قاعة</button>
  <ul id="roomsList"></ul>
</section>

<section>
  <h2>إضافة مدرس</h2>
  <input type="text" id="teacherName" placeholder="اسم المدرس">
  <input type="text" id="subjectName" placeholder="المادة">
  <input type="number" id="requiredLessons" placeholder="عدد الحصص الأسبوعية">
  <input type="number" id="lessonDuration" placeholder="مدة الحصة (بالساعات)">
  <select id="weekType">
    <option value="كل">كل الأسابيع</option>
    <option value="زوجي فقط">زوجي فقط</option>
    <option value="فردي فقط">فردي فقط</option>
  </select>
  <h4>التوافر الزمني:</h4>
  <div id="availabilityGrid"></div>
  <button onclick="addTeacher()">➕ إضافة مدرس</button>
  <table id="teachersTable">
    <thead>
      <tr><th>المدرس</th><th>المادة</th><th>الحصص</th><th>المدة</th><th>النوع</th><th>🗑</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<section style="text-align:center;">
  <button onclick="generate()">📅 توليد الجدولين</button>
</section>

<section>
  <h2>📋 جدول الأسبوع <strong>الزوجي</strong></h2>
  <div id="evenSchedule"></div>
  <button onclick="downloadPDF('evenSchedule')">📄 تحميل PDF</button>
</section>

<section>
  <h2>📋 جدول الأسبوع <strong>الفردي</strong></h2>
  <div id="oddSchedule"></div>
  <button onclick="downloadPDF('oddSchedule')">📄 تحميل PDF</button>
</section>

<script src="app.js"></script>
</body>
</html>
